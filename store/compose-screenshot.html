<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sample</title>
<style>
  /* Composes one device screenshot into a Google Play phone screenshot:
     1080x1920 (9:16), opaque (Play rejects transparency), with the app's own
     background colour used for the letterbox so the bars are invisible.
     Rendered by store/render-screenshots.sh via headless Chrome. */
  * { margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #12151A; }
  body { display: flex; align-items: center; justify-content: center; }
  img { height: 1920px; width: auto; display: block; }
</style>
</head>
<body>
  <img id="shot" alt="">
  <script>
    // The capture path arrives as ?img=...; the background colour can be
    // overridden with ?bg=%23RRGGBB (render-screenshots.sh samples the real
    // colour from the capture and passes it in).
    (function () {
      const params = new URLSearchParams(location.search);
      const img = params.get("img");
      if (img) document.getElementById("shot").src = img;
      const bg = params.get("bg");
      if (bg) document.body.style.background = bg;
    })();
  </script>
</body>
</html>
