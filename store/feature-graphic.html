<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KmExpense — Play feature graphic 1024×500</title>
<style>
  /* Google Play feature graphic: 1024x500, no transparency, no rounded outer
     corners. Palette is the app's (mint #41D8B7, amber #FFD166, dark neutrals).
     Text stays inside a ~56px margin because Play crops this banner in some
     placements. Regenerate with: store/render-assets.sh */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #12151A 0%, #171C24 55%, #1B1F27 100%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #E8ECF1;
    display: flex;
    align-items: center;
    gap: 52px;
    padding: 56px;
  }
  /* mint hairline along the top, like the app's header accent */
  .hairline { position: absolute; top: 0; left: 0; width: 1024px; height: 5px; background: #41D8B7; }

  .card {
    flex: 0 0 auto;
    width: 250px; height: 250px;
    background: #101418;
    border: 1px solid #2A303B;
    border-radius: 56px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
  }
  .card svg { width: 210px; height: 210px; }

  .text { display: flex; flex-direction: column; gap: 6px; }
  .name {
    font-size: 84px; font-weight: 700; color: #41D8B7;
    letter-spacing: -1.5px; line-height: 1.02;
  }
  .tagline { font-size: 38px; line-height: 1.25; color: #E8ECF1; }
  .tagline .dim { color: #9AA4B2; }
  .pill {
    align-self: flex-start;
    margin-top: 16px;
    font-size: 25px;
    color: #FFD166;
    background: #574419;
    border-radius: 999px;
    padding: 9px 22px;
  }
</style>
</head>
<body>
  <div class="hairline"></div>

  <div class="card">
    <!-- same composition as store/icon.svg -->
    <svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(54 54) scale(1.25) translate(-54 -54)">
        <path d="M54,24 C82,40 26,68 54,84" fill="none" stroke="#41D8B7" stroke-width="24"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M54,24 C82,40 26,68 54,84" fill="none" stroke="#101418" stroke-width="4"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M41,41q0,-5 5,-5h16q5,0 5,5v26q0,5 -5,5h-16q-5,0 -5,-5z"
              fill="#FFD166" stroke="#101418" stroke-width="2"/>
        <path d="M45,45h18v9h-18z M45,58h18v9h-18z" fill="#101418"/>
      </g>
    </svg>
  </div>

  <div class="text">
    <div class="name">KmExpense</div>
    <div class="tagline">Automatic trip logging.<br><span class="dim">Excel expense reports.</span></div>
    <div class="pill">Local-only · no account · no ads</div>
  </div>
</body>
</html>
